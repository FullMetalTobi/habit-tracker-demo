name: CI

# Pipeline for this demo project (npm + a static Nuxt SPA):
#   - test (lint, unit tests, typecheck) and build (static generate) run on
#     every push to main and on every PR.
#   - e2e (Playwright) runs when site files changed; docs-only changes skip it.
# There is no deployment job: the app is built and tested, never published.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs; never cancel branch pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04-arm
    outputs:
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] \
             || [ -z "$BASE_SHA" ] \
             || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qE '^(app/|public/|e2e/|nuxt\.config\.ts$|playwright\.config\.ts$|package\.json$|package-lock\.json$|tsconfig\.json$)'; then
            echo "site=true" >> "$GITHUB_OUTPUT"
          else
            echo "site=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck

  build:
    name: Build
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04-arm
    env:
      NUXT_TELEMETRY_DISABLED: '1'
      # Stamp the generated build with its commit SHA in version.json (ADR-0020).
      # Applies to both "Generate" steps below.
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Cache Nuxt build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .nuxt
            .nitro
            node_modules/.cache
          key: nuxt-build-${{ runner.os }}-${{ runner.arch }}-${{ github.event_name == 'pull_request' && 'preview' || 'production' }}-${{ hashFiles('package-lock.json', 'app/**', 'public/**', 'nuxt.config.ts', 'tsconfig.json') }}
          restore-keys: |
            nuxt-build-${{ runner.os }}-${{ runner.arch }}-${{ github.event_name == 'pull_request' && 'preview' || 'production' }}-

      - name: Generate static site (production)
        if: github.event_name != 'pull_request'
        run: npm run generate

      - name: Generate static site (preview)
        if: github.event_name == 'pull_request'
        env:
          NUXT_APP_BASE_URL: /pr-${{ github.event.pull_request.number }}/
          NUXT_PUBLIC_NOINDEX: 'true'
        run: npm run generate

      - name: Upload site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-output
          path: .output/public
          # Required so .htaccess (a dotfile) is packed into the artifact —
          # upload-artifact strips hidden files by default.
          include-hidden-files: true
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  e2e:
    name: E2E
    needs: changes
    # Skip on docs-only changes.
    if: github.event.action != 'closed' && needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04-arm
    env:
      CI: 'true'
      NUXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Cache the Playwright browser binaries, keyed on the installed version.
      - name: Resolve Playwright version
        id: pw
        shell: bash
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Tests run against a locally built-and-served copy of the app; the
      # webServer in playwright.config.ts handles `npm run build && npm run preview`.
      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore
